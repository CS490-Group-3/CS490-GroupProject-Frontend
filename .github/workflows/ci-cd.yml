name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  selenium-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Chrome/Chromium for Selenium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
      
      - name: Install Node dependencies
        run: npm ci
      
      - name: Install Selenium dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/selenium/requirements.txt
      
      - name: Start frontend dev server
        run: |
          npm run dev > /tmp/frontend.log 2>&1 &
          echo $! > /tmp/frontend.pid
          sleep 15
        env:
          VITE_API: https://cs490-groupproject-backend-production.up.railway.app/api
          VITE_MOCK: 0
      
      - name: Wait for frontend to be ready
        run: |
          timeout 30 bash -c 'until curl -f http://localhost:5173 > /dev/null 2>&1; do sleep 2; done' || true
          sleep 5
      
      - name: Run Selenium E2E tests
        run: |
          cd tests/selenium
          python3 test_comprehensive.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      
      - name: Stop frontend server
        if: always()
        run: |
          if [ -f /tmp/frontend.pid ]; then
            kill $(cat /tmp/frontend.pid) || true
          fi
      
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-results
          path: tests/selenium/
          if-no-files-found: ignore
